<!DOCTYPE html>
<html>
<head>
  <title>Hello World Button</title>
</head>
<body>

  <button onclick="sayHello()">Click me</button>
  <p id="message"></p>

  <script>
    function sayHello() {
      document.getElementById("message").innerText = "Hello World";
    }
  </script>

</body>
</html>
