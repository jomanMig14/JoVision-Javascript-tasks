<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Get IP</title>
</head>
<body>

  <button id="getIpBtn">Get ip</button>

  <script>
    document.getElementById("getIpBtn").addEventListener("click", function () {

      fetch('https://api.ipify.org/?format=json')
        .then(response => {
          if (response.ok) {
            return response.json();
          } else {
            throw new Error('Network response was not ok');
          }
        })
        .then(data => alert("Your IP: " + data.ip))
        .catch(error => alert('There was a problem with the fetch operation: ' + error));
    });
  </script>

</body>
</html>
